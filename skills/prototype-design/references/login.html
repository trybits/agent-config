<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录</title>
    <link rel="stylesheet" href="./common.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-card">
        <div class="auth-brand">
          <h1>EZ-PROTOTYPE</h1>
          <p>数字工坊</p>
        </div>
        <section class="card">
          <div class="card-body stack">
            <div>
              <label class="label" for="email">邮箱地址</label>
              <input class="input" id="email" type="email" placeholder="name@company.com" />
            </div>
            <div>
              <div class="row between" style="margin-bottom: 6px">
                <label class="label" for="password" style="margin: 0">密码</label>
                <a href="#" style="font-size: 12px; color: var(--primary)">忘记密码？</a>
              </div>
              <input class="input" id="password" type="password" placeholder="••••••••" />
            </div>
            <label class="row table-total-rows">
              <input class="ui-checkbox" type="checkbox" aria-label="记住登录状态"> 记住登录状态
            </label>
            <button class="btn btn-primary" type="button">登录</button>
            <div class="row" style="justify-content: center; color: var(--text-hint); font-size: 12px">或</div>
            <div class="grid cols-2" style="gap: 10px">
              <button class="btn btn-outline" type="button">使用 Link 登录</button>
              <button class="btn btn-outline" type="button">使用 SSO 登录</button>
            </div>
          </div>
        </section>
        <p class="footer-note">没有账号？ <a href="#" style="color: var(--primary)">联系管理员</a></p>
      </main>
    </div>
  </body>
</html>
