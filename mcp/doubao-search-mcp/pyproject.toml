[project]
name = "doubao-search-mcp"
version = "0.1.0"
description = "MCP server for Doubao (Volcengine) web search API — 联网搜索能力"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.9.4,<2",
    "aiohttp>=3.9.0",
]
license = "MIT"
keywords = ["mcp", "search", "doubao", "volcengine", "web-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
doubao-search-mcp = "doubao_search_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doubao_search_mcp"]
