[project]
name = "zhipu-glm-vision-mcp"
version = "0.1.3"
description = "MCP server for GLM-4.6V-Flash multimodal understanding (image/video/file) via Zhipu API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "mcp>=2.0.0,<3",
]
keywords = ["mcp", "vision", "glm", "zhipu", "multimodal"]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.scripts]
zhipu-glm-vision-mcp = "zhipu_glm_vision_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhipu_glm_vision_mcp"]
